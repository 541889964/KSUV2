name: Build ScreenAgent
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: List NDKs
        run: ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "no ndk"
      - name: Clone llama.cpp
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
          ls app/src/main/cpp/llama.cpp/llama.h
      - name: Download model
        run: |
          mkdir -p app/src/main/assets/models
          URL="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          echo "Downloading $URL"
          curl -L --fail --retry 3 --connect-timeout 15 -o app/src/main/assets/models/model.gguf "$URL"
          ls -lh app/src/main/assets/models/
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
