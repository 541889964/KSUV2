name: Build ScreenAgent
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" > /dev/null 2>&1
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
      - run: pip install -U "huggingface_hub[hf_transfer]"
      - name: Download model
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: |
          mkdir -p app/src/main/assets/models
          huggingface-cli download Qwen/Qwen2.5-1.5B-Instruct-GGUF qwen2.5-1.5b-instruct-q4_k_m.gguf --local-dir /tmp/m
          cp /tmp/m/*.gguf app/src/main/assets/models/model.gguf
          ls -lh app/src/main/assets/models/
      - run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        if: always()
        run: |
          mkdir -p release
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release/ScreenAgent.apk \; 2>/dev/null || true
      - name: Split
        if: hashFiles('release/ScreenAgent.apk') != ''
        run: |
          cd release
          SZ=$(stat -c%s ScreenAgent.apk)
          if [ "$SZ" -gt 1500000000 ]; then
            zip -s 1500m ScreenAgent.zip ScreenAgent.apk
            rm ScreenAgent.apk
          fi
      - uses: softprops/action-gh-release@v2
        if: hashFiles('release/*') != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
