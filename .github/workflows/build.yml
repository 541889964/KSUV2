name: Build XuanYi Ksu
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Save errors
        if: failure()
        run: |
          mkdir -p /tmp/logs
          grep -E "^e: |error: |FAILURE|What went wrong|Unresolved|Expecting|Conflicting" manager/build.log > /tmp/logs/errors.txt 2>/dev/null || true
          tail -200 manager/build.log >> /tmp/logs/errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-errors, path: /tmp/logs/errors.txt, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: XuanYiKsu
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
