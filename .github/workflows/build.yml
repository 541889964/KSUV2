name: Build ScreenAgent
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: List NDKs
        run: ls $ANDROID_HOME/ndk/ || true
      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
      - name: Install hf tools
        run: pip install -U huggingface_hub
      - name: Download model
        run: |
          mkdir -p app/src/main/assets/models
          huggingface-cli download Qwen/Qwen2.5-1.5B-Instruct-GGUF qwen2.5-1.5b-instruct-q4_k_m.gguf --local-dir /tmp/m
          cp /tmp/m/*.gguf app/src/main/assets/models/model.gguf
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
